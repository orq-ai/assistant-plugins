name: skills-ci
on:
  pull_request:
    # `edited` re-runs the checks when the PR is retargeted or retitled — a
    # green status computed against the old base/title must not carry over.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate plugin manifests
        run: tests/scripts/validate-plugin-manifests.sh
      - name: Validate root plugin.json against the vendored Agent Plugins 1.0.0 schema
        # The schema is vendored, not fetched: spec §5.2 forbids clients
        # retrieving a schema while loading a plugin, and a CI check should not
        # depend on agent-plugins.org being up. ajv itself comes from npx, the
        # same zero-install pattern the install-sanity job below uses.
        run: npx -y ajv-cli@5 validate --spec=draft2020 -s tests/schemas/agent-plugins-1.0.0.plugin.schema.json -d plugin.json
      - name: Validate skills (frontmatter, lock invariants + hash freshness, version sync, content patterns)
        run: node tests/scripts/validate-skills.mjs
      - uses: astral-sh/setup-uv@v5
      - name: Cross-check every skill against the reference validator
        # validate-skills.mjs is our own reading of the Agent Skills spec;
        # skills-ref is the spec's own implementation and the only authority on
        # conformance. CLAUDE.md told maintainers to run it by hand, which made
        # the one check that can catch a misreading the one check nothing ran.
        # PYTHONUTF8: skills-ref reads SKILL.md with the locale encoding, and
        # several skills carry non-ASCII.
        env:
          PYTHONUTF8: "1"
          # Pinned: unpinned, an upstream commit to agentskills turns unrelated
          # PRs red. Bump deliberately when re-checking against a newer spec.
          SKILLS_REF: "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
        run: |
          set -uo pipefail
          # Resolve once, then reuse the cached env: uvx inside the loop would
          # do 15 git resolutions per run.
          uvx --from "$SKILLS_REF" skills-ref --help > /dev/null
          rc=0
          for d in skills/*/; do
            uvx --from "$SKILLS_REF" skills-ref validate "$d" || rc=1
          done
          # Report every non-conformant skill in one run: aborting on the first
          # turns a shared frontmatter mistake into one CI round-trip per skill.
          if [ "$rc" -ne 0 ]; then
            echo "::error::one or more skills failed the Agent Skills reference validator (see above)"
            exit 1
          fi
      - name: Self-test the validator (each invariant must fail the run when violated)
        run: bash tests/scripts/validate-skills.test.sh
      - name: PR title pattern lint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Keep in sync with the patterns in tests/scripts/validate-skills.mjs.
          if echo "$PR_TITLE" | grep -qi "owner decision" \
             || echo "$PR_TITLE" | grep -qP '\b(?!RES-|UTF-|ISO-|GPT-|ADR-|SHA-|OWASP-|ASI-|A2A-)[A-Z]{2,5}-[0-9]+\b'; then
            echo "::error::PR title contains internal decision context or a non-project ticket id"
            exit 1
          fi
          echo "title ok"

  skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run each skill's pytest suite
        # Until now nothing in CI ran these: the suites existed and were green
        # only on whoever last ran them locally. A skill opts in by shipping
        # tests/requirements.txt (its scripts declare deps inline via PEP 723,
        # which pytest never reads because it imports the modules directly).
        # `--no-project` keeps each suite in its own ephemeral env, so one
        # skill's deps can't mask a missing dep in another's.
        run: |
          set -euo pipefail
          found=0
          for req in skills/*/tests/requirements.txt; do
            [ -e "$req" ] || continue
            skill=$(dirname "$(dirname "$req")")
            found=1
            echo "::group::pytest $skill"
            (cd "$skill" && uv run --no-project --with-requirements tests/requirements.txt \
              python -m pytest tests/ -q)
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no skills/*/tests/requirements.txt found — the test job would pass vacuously"
            exit 1
          fi

  version-bump-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require manifest version bump + changelog entry when the shipped surface changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mb=$(git merge-base "origin/$BASE_REF" HEAD)
          # Key the gate on skills-lock.json: the lockfile is the definition of
          # the shipped surface (the validate job enforces its hashes are fresh),
          # so it provably changes whenever any shipped skill does — regardless
          # of which path the skill shipped from.
          if ! git diff --name-only "$mb"..HEAD | grep -qx 'skills-lock.json'; then
            echo "skills-lock.json unchanged — shipped surface unchanged, gate not applicable"
            exit 0
          fi
          # Compare parsed versions at the merge-base vs HEAD; a grep on the diff
          # would also match unchanged context lines near the version field.
          base_v=$(git show "$mb:.claude-plugin/plugin.json" | jq -r .version)
          head_v=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$base_v" = "$head_v" ]; then
            echo "::error::shipped surface changed (skills-lock.json) but the manifest version is still $head_v — bump all 4 manifests (see CLAUDE.md; the validate job enforces they match)"
            exit 1
          fi
          # A downgrade must not satisfy the gate: head must sort strictly after base.
          if [ "$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)" != "$head_v" ]; then
            echo "::error::manifest version went backwards ($base_v -> $head_v)"
            exit 1
          fi
          # Require an actual entry for the new version, not just a touched file.
          if ! git diff "$mb"..HEAD -- CHANGELOG.md | grep -q "^+## \[$head_v\]"; then
            echo "::error::version bumped ($base_v -> $head_v) but CHANGELOG.md gained no '## [$head_v]' entry (see CLAUDE.md)"
            exit 1
          fi
          echo "shipped surface changed, version $base_v -> $head_v, changelog entry present — ok"

  install-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the suite from this checkout via npx skills
        run: |
          set -euo pipefail
          jq -r '.skills | keys[]' "$GITHUB_WORKSPACE/skills-lock.json" | sort > /tmp/expected.txt
          tmp=$(mktemp -d) && cd "$tmp"
          # || true: a failed install is caught by the set comparison below,
          # which also surfaces install.log context.
          npx -y skills add "$GITHUB_WORKSPACE" -y 2>&1 | tee install.log || true
          # Unique skill names, not SKILL.md files — installers may write the
          # same skill to several agent locations.
          # -r: a zero-file install is the regression this step exists to
          # report, and without it xargs runs basename on empty input, which
          # exits 1 and kills the step under pipefail before the diff below.
          find . -name SKILL.md -exec dirname {} \; | xargs -r -n1 basename | sort -u > /tmp/installed.txt
          # Compare the name sets, not their sizes: a count assertion passes
          # when one real skill is dropped and one phantom installed.
          if ! diff -u /tmp/expected.txt /tmp/installed.txt > /tmp/setdiff.txt; then
            echo "--- expected (skills-lock.json keys) vs installed ---"
            cat /tmp/setdiff.txt
            echo "--- tail of install.log (registry blip vs real regression) ---"
            tail -n 30 install.log || true
            echo "::error::the installed skill set does not match skills-lock.json (diff and install.log tail above)"
            exit 1
          fi
          echo "installed skill set matches skills-lock.json ($(wc -l < /tmp/expected.txt) skills)"
