# Evaluator Alignment skill — run configuration (RES-930).
# Every step reads this file; CLI flags override individual keys. Paths are
# resolved relative to the skill/ directory unless absolute.

# ── Step 1: evaluator under audit ────────────────────────────────────────────
# orq evaluator id (24-hex). Set on the CLI with `--evaluator_id <id>` or here.
evaluator_id = ""

# ── Step 1 (cont.): trace retrieval (v3oql + v3spans) ───────────────────────
# Epoch-ms window for the v3oql query. 0 = unbounded on that side.
trace_start_date = 0
trace_end_date = 0
# Max traces to pull (paginated by the client). Caps the candidate pool.
trace_limit = 200

# ── Step 3: stability run (evaluatorq, repetitions=N) ────────────────────────
# Repeated judge invocations per datapoint. The whole flip analysis rests on
# this; >= 5 is the floor for a stable per-row flip-rate, 8 is the default.
n_repeats = 8
# Cap on datapoints the stability run covers. -1 / null = all fetched traces.
num_samples = -1
# Parallel judge calls across all (row, repeat) pairs.
max_concurrency = 8
# Per-call judge temperature, applied client-side by evaluatorq. The hosted orq
# path drops this (project memory, verified 2026-05-27); routing through
# evaluatorq is the whole reason this knob works. 1 is the self-consistency
# measurement default; 0 collapses variance and hides flips. Note: GPT-5-family
# judges (e.g. gpt-5-mini) only accept temperature=1 and 400 on any other value.
temperature = 1
# Stable evaluatorq experiment path so the retest lands on the SAME experiment
# as the baseline run. Empty -> derived from the evaluator key.
experiment_path = ""

# The step-8 retest defaults to the repeat count and temperature the ORIGINAL
# stability run actually used (read back from metrics.json), not to the values
# here — instability is estimated from N samples at a temperature, so retesting
# at different ones compares two different measurements. `retest.py --n_repeats N`
# / `--temperature T` override; a LOWER N than the original marks the comparison
# not comparable rather than letting the sample size read as an improvement.

# ── Step 5: confuser queue ───────────────────────────────────────────────────
# Random sample of LOW-flip items to annotate alongside the high-flip queue, as
# a sanity check against the consistently-wrong blind spot (design §1, §8).
# 0 = pure flip-ranking, no sanity sample.
low_flip_sample_size = 5
# Deterministic seed for the low-flip sample draw.
seed = 42

# ── Step 6: grey-zone payload context budget (design §12) ────────────────────
# How many (most-unstable-first) confusers may enter the conductor's context.
# -1 = all, matching the num_samples/count sentinel elsewhere; 0 = none. The token
# budget below does the real capping — a fixed K is the wrong knob because item
# size varies by orders of magnitude between evaluators.
grey_zone_top_k = -1
# Per-confuser budget for the judged input, in characters. Fair-shared across the
# evaluator's {{variables}} so a long {{query}} cannot starve {{output}}; an
# over-share value is shown head+tail with the elided count marked inline.
grey_zone_max_chars = 600
# Ceiling for the whole assembled payload, in tokens (~4 chars/token). assemble
# clamps to the longest prefix that fits and reports what it dropped. Deliberately
# well below a full context window: the payload shares that window with SKILL.md,
# evaluator.json, and the multi-turn grey-zone Q&A that follows.
grey_zone_max_tokens = 60000

# ── Step 6/7: recommendation + rewrite backend ───────────────────────────────
# Which model writes the recommendation (step 6 fallback) and the rewritten prompt (step 7).
#   "orq_router"      — DEFAULT. Any workspace model over the orq router, using the
#                       ORQ_API_KEY this skill already needs. No second account, no
#                       CLI. The model must be reachable on your workspace — a model
#                       can be listed and still 403 for want of a provider key, so
#                       step 7 checks with one tiny call before spending anything.
#   "claude_subagent" — shell out to `claude -p ... --output-format json`. Needs the
#                       `claude` CLI installed and logged in; use it if you'd rather
#                       spend Claude credits than workspace credits.
#   "orq_deployment"  — an existing orq deployment (see backend_deployment_key)
#   "anthropic_api"   — direct Anthropic Messages API (needs ANTHROPIC_API_KEY)
#   "fake"            — deterministic canned completions (tests only)
backend = "orq_router"
# Model for the chosen backend. LEAVE BLANK to take that backend's own default
# (orq_router → deepseek/deepseek-v4-pro, claude_subagent/anthropic_api →
# claude-opus-4-8), so switching `backend` alone is a valid edit. For orq_router
# this must be the provider-qualified `refId` from GET /v2/models
# (e.g. "deepseek/deepseek-v4-pro"), not the shorter display alias.
backend_model = ""
# orq deployment key when backend = "orq_deployment".
backend_deployment_key = ""
# Bounded parallelism for per-annotation meta-prompt calls (step 6 fallback).
recommend_concurrency = 4

# ── Output ───────────────────────────────────────────────────────────────────
# Parent directory for per-run working directories (runs/<key>_<ts>/).
runs_dir = "runs"
